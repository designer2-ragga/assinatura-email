<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Como aplicar a assinatura no Gmail — Grupo Ragga</title>
<style>
  :root{
    --bg:#FAFAF7;
    --ink:#1A1A1A;
    --ink-2:#3D3D3A;
    --muted:#6B6B68;
    --line:#E6E6E0;
    --grupo:#2D1B4E;
    --grupo-soft:#F4EFFB;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    -webkit-font-smoothing:antialiased; /* [3] Font smoothing */
    -moz-osx-font-smoothing:grayscale;
    font-variant-numeric:tabular-nums; /* [4] Numerals don't cause layout shift */
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    background:#fff;
    /* [5] Shadow instead of border */
    box-shadow:0 1px 0 rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.02);
  }
  .topbar img{height:24px;width:auto;display:block}
  @media (min-width:600px){
    .topbar{padding:18px 28px}
    .topbar img{height:28px}
  }
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:var(--muted);
    text-decoration:none;
    font-size:13px;
    font-weight:600;
    padding:8px 4px;
    transition:color .15s ease;
  }
  .back-link:hover{color:var(--ink)}
  .back-link:active{scale:0.96}

  .progress{height:3px;background:var(--line);position:relative}
  .progress > i{position:absolute;inset:0 auto 0 0;background:var(--grupo);width:0%;transition:width .35s ease}
  .progress-label{text-align:center;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 0 0}

  main{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 16px 60px;position:relative;overflow:hidden}
  @media (min-width:600px){
    main{padding:32px 24px 80px}
  }
  .step{
    width:100%;
    max-width:720px;
    opacity:0;
    transform:translateY(24px);
    transition:opacity .35s ease, transform .35s ease;
    position:absolute;inset:auto;pointer-events:none;
  }
  .step.is-active{opacity:1;transform:translateY(0);position:relative;pointer-events:auto}
  .step.is-leaving{opacity:0;transform:translateY(-12px);transition-duration:.15s}

  .step.is-active > *{animation:step-enter .4s ease-out both}
  .step.is-active > *:nth-child(1){animation-delay:0ms}
  .step.is-active > *:nth-child(2){animation-delay:60ms}
  .step.is-active > *:nth-child(3){animation-delay:120ms}
  .step.is-active > *:nth-child(4){animation-delay:180ms}
  .step.is-active > *:nth-child(5){animation-delay:240ms}
  .step.is-active > *:nth-child(6){animation-delay:300ms}
  .step.is-active > *:nth-child(7){animation-delay:360ms}
  @keyframes step-enter{
    from{opacity:0;transform:translateY(8px);filter:blur(4px)}
    to{opacity:1;transform:translateY(0);filter:blur(0)}
  }

  .step .visual{
    background:var(--grupo-soft);
    border-radius:14px;
    padding:20px 16px;
    margin-bottom:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:160px;
    box-shadow:inset 0 0 0 1px rgba(45,27,78,0.06);
  }
  @media (min-width:600px){
    .step .visual{padding:32px;margin-bottom:28px;min-height:220px}
  }
  .step .visual svg{
    display:block;width:100%;max-width:480px;height:auto;
    outline:1px solid rgba(0,0,0,0.06);
    outline-offset:-1px;
    border-radius:6px;
  }

  .step .eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--grupo);margin:0 0 8px}
  .step h1{
    font-size:20px;line-height:1.2;margin:0 0 10px;font-weight:700;letter-spacing:-0.01em;
    text-wrap:balance;
  }
  .step p{
    font-size:14px;line-height:1.55;color:var(--ink-2);margin:0 0 10px;
    text-wrap:pretty;
  }
  @media (min-width:600px){
    .step .eyebrow{font-size:12px;margin:0 0 12px}
    .step h1{font-size:28px;margin:0 0 14px}
    .step p{font-size:16px;margin:0 0 12px}
  }
  .step kbd{display:inline-block;background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:2px 8px;font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);margin:0 2px}
  .step .hint{
    margin-top:12px;padding:12px 14px;background:#FFF7E5;
    border-left:3px solid #E0B100;
    border-radius:0;
    font-size:13px;color:#5A4500;
    text-wrap:pretty;
  }

  .actions{margin-top:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  @media (min-width:600px){
    .actions{margin-top:28px}
  }
  button{
    cursor:pointer;font-family:inherit;font-weight:700;border:none;
    transition:scale .15s ease, background-color .15s ease, color .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  button:active{scale:0.96}
  .btn-primary{
    background:var(--grupo);color:#fff;font-size:15px;
    padding:12px 22px;border-radius:999px;
    display:inline-flex;align-items:center;gap:8px;
    min-height:44px;
    box-shadow:0 1px 2px rgba(45,27,78,0.18), 0 4px 12px rgba(45,27,78,0.12);
  }
  @media (min-width:600px){
    .btn-primary{font-size:16px;padding:14px 28px;gap:10px}
  }
  .btn-primary:hover{
    background:#3D2964;
    box-shadow:0 2px 4px rgba(45,27,78,0.24), 0 6px 16px rgba(45,27,78,0.16);
  }
  .btn-secondary{
    background:transparent;color:var(--muted);
    font-size:14px;padding:10px 14px;
    min-height:40px;
    border-radius:8px;
  }
  .btn-secondary:hover{color:var(--ink);background:rgba(0,0,0,0.03)}
  .enter-hint{font-size:12px;color:var(--muted);margin-left:6px}
  .enter-hint kbd{font-size:11px;padding:1px 6px}

  .done .visual{background:#E7F4ED;box-shadow:inset 0 0 0 1px rgba(31,122,74,0.12)}
  .done .check{
    width:72px;height:72px;border-radius:50%;
    background:#1F7A4A;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto;
    box-shadow:0 4px 12px rgba(31,122,74,0.32), 0 1px 2px rgba(31,122,74,0.24);
  }
  .done h1{text-align:center}
  .done p{text-align:center}
  .done .actions{justify-content:center}

  @media (max-width:560px){
    .step h1{font-size:18px}
    .step p{font-size:13px}
    .step .visual{padding:14px;min-height:120px}
    main{padding:16px 12px 48px}
  }

  /* Respect reduced-motion */
  @media (prefers-reduced-motion: reduce){
    .step, .step.is-active > *, .progress > i{animation:none !important;transition:none !important}
  }
  /* Version footer — friendly date, debug detail on hover */
  .version-footer{
    text-align:center;margin:8px 0 20px;padding:8px;
    font-size:12px;color:var(--muted);line-height:1.4;
  }
  .version-footer .pill{
    display:inline-block;padding:4px 10px;border-radius:999px;
    background:rgba(0,0,0,0.04);cursor:default;
    transition:background-color .15s ease;
  }
  .version-footer .pill:hover{background:rgba(0,0,0,0.07)}
</style>
</head>

    body: [
      'Clique dentro do campo grande de edição da assinatura.',
      'Use <kbd>Ctrl</kbd> + <kbd>V</kbd> (Windows) ou <kbd>Cmd</kbd> + <kbd>V</kbd> (Mac).',
      'O texto formatado e o banner da sua vertical aparecem prontinhos.'
    ],
    hint: 'Use o Ctrl/Cmd+V normal — <strong>não</strong> use "colar como texto sem formatação", senão você perde a imagem e a linha colorida.',
    illustration: ILL.paste
  },
  {
    eyebrow: 'Passo 6 — Padrão',
    title: 'Defina como assinatura padrão',
    body: [
      'Logo abaixo, em <strong>"Padrões de assinatura"</strong>, selecione sua nova assinatura tanto para <strong>NOVOS E-MAILS</strong> quanto para <strong>RESPOSTA/ENCAMINHAMENTO</strong>.'
    ],
    illustration: ILL.defaults
  },
  {
    eyebrow: 'Passo 7 — Salvar',
    title: 'Salve as alterações',
    body: [
      'Role até o final da página de configurações.',
      'Clique em <strong>"Salvar alterações"</strong>.'
    ],
    cta: 'Concluir',
    illustration: ILL.save
  },
  {
    type: 'done',
    title: 'Pronto! Sua assinatura está ativa.',
    body: [
      'A próxima mensagem que você enviar já sai com a assinatura nova do Grupo Ragga.',
      'Se quiser trocar de vertical depois, é só voltar ao gerador e repetir.'
    ],
    illustration: ILL.done
  }
];

const stage = document.getElementById('stage');
const progressBar = document.getElementById('progressBar');
const progressLabel = document.getElementById('progressLabel');

let idx = 0;

function renderStep(){
  const total = STEPS.length;
  const s = STEPS[idx];
  const pct = ((idx) / (total - 1)) * 100;
  progressBar.style.width = pct + '%';
  progressLabel.textContent = s.type === 'done' ? 'Tudo certo' : `Passo ${idx + 1} de ${total}`;

  const isDone = s.type === 'done';
  const cta = s.cta || (idx === total - 1 ? 'Concluir' : 'Próximo');
  const showBack = idx > 0 && !isDone;
  const bodyHTML = (s.body || []).map(p => `<p>${p}</p>`).join('');
  const hintHTML = s.hint ? `<div class="hint">${s.hint}</div>` : '';
  const eyebrowHTML = s.eyebrow ? `<p class="eyebrow">${s.eyebrow}</p>` : '';
  const visualHTML  = s.illustration ? `<div class="visual">${s.illustration}</div>` : '';

  const buttonsHTML = isDone
    ? `<div class="actions"><a class="btn-primary" href="index.html">Voltar ao gerador <span aria-hidden="true">→</span></a></div>`
    : `<div class="actions">
         <button class="btn-primary" id="btnNext">${cta} <span aria-hidden="true">→</span></button>
         ${showBack ? `<button class="btn-secondary" id="btnBack">Voltar</button>` : ''}
         <span class="enter-hint">ou <kbd>Enter</kbd></span>
       </div>`;

  stage.innerHTML = `
    <article class="step is-active ${isDone ? 'done' : ''}">
      ${visualHTML}
      ${eyebrowHTML}
      <h1>${s.title}</h1>
      ${bodyHTML}
      ${hintHTML}
      ${buttonsHTML}
    </article>
  `;

  const next = document.getElementById('btnNext');
  const back = document.getElementById('btnBack');
  if (next) next.addEventListener('click', advance);
  if (back) back.addEventListener('click', goBack);
}

function advance(){
  if (idx >= STEPS.length - 1) return;
  const current = stage.querySelector('.step');
  if (current) current.classList.add('is-leaving');
  setTimeout(() => { idx += 1; renderStep(); }, 280);
}
function goBack(){
  if (idx === 0) return;
  const current = stage.querySelector('.step');
  if (current) {
    current.style.transition = 'opacity .25s ease, transform .25s ease';
    current.style.opacity = '0';
    current.style.transform = 'translateY(24px)';
  }
  setTimeout(() => { idx -= 1; renderStep(); }, 240);
}

document.addEventListener('keydown', (e) => {
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); advance(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); goBack(); }
});

renderStep();
</script>
